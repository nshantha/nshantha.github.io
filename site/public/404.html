<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;1,400&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
  <title>Not found — Nitesh Shantha Kumar</title>
  <style>
    :root { --paper: #f2f0e9; --ink: #16150f; --muted: #56544b; --accent: #c8532c; --shadow: #16150f; }
    @media (prefers-color-scheme: dark) { :root { --paper: #141413; --ink: #ebe8df; --muted: #b3afa4; --accent: #d9683f; --shadow: #000; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 16px/1.6 "IBM Plex Sans", system-ui, sans-serif; text-align: center; }
    h1 { margin: 0; font: 500 clamp(64px, 14vw, 120px)/1 "Pixelify Sans", monospace; color: var(--accent); }
    p { color: var(--muted); margin: 14px 0 26px; }
    a { display: inline-block; padding: 10px 14px; border: 1px solid var(--ink); color: var(--ink); text-decoration: none; font: 500 13px/1 "IBM Plex Mono", monospace; box-shadow: 3px 3px 0 var(--shadow); }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page wandered off, probably to make coffee.</p>
    <a href="/">← Back home</a>
  </main>
</body>
</html>
